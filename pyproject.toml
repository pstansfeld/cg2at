[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
# Published on PyPI as "cg2at2" ("cg2at" on PyPI belongs to an unrelated project).
# The command and the installed Python package are still called cg2at.
name = "cg2at2"
version = "1.0.2"   # keep in step with VERSION in database/bin/g_var.py
authors = [{name = "Owen N. Vickery"}, {name = "Phillip J. Stansfeld", email = "phillip.stansfeld@warwick.ac.uk"}]
maintainers = [{name = "Phillip J. Stansfeld", email = "phillip.stansfeld@warwick.ac.uk"}]
description = "CG2AT2: fragment-based conversion of coarse-grained (e.g. Martini) systems to atomistic resolution."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy >= 1.26.4", "scipy"]
classifiers = ["Programming Language :: Python :: 3"]
license = "GPL-3.0"
license-files = ["LICENSE"]
keywords = ["CG", "Martini", "backmapping", "GROMACS"]

[project.optional-dependencies]
refine = ["MDAnalysis >= 2.0", "matplotlib"]

[project.scripts]
cg2at = "cg2at.bin.cg2at:main"
cg2at2 = "cg2at.bin.cg2at:main"
cg2at_refine = "cg2at.bin.cg2at_refine:main"
traj_dih_guide = "cg2at.bin.traj_dih_guide:main"

[project.urls]
Homepage = "https://github.com/pstansfeld/cg2at"
"Original CG2AT" = "https://github.com/owenvickery/cg2at"
"CG2AT-lite" = "https://github.com/pstansfeld/cg2at-lite"

# The repository keeps its historical layout (database/bin, database/forcefields,
# database/fragments).  Installed, database/ becomes the `cg2at` package, so the
# scripts find the database at ../forcefields and ../fragments in both layouts.
[tool.setuptools]
package-dir = {"cg2at" = "database"}
packages = ["cg2at", "cg2at.bin"]
include-package-data = true

[tool.setuptools.package-data]
cg2at = ["forcefields/**/*", "fragments/**/*"]
"cg2at.bin" = ["rama_data/*.data"]

[tool.setuptools.exclude-package-data]
"*" = [".DS_Store"]
